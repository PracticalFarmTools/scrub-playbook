[project]
name = "kalshi-crypto-bot"
version = "0.1.0"
description = "Trading bot for Kalshi's 15-minute crypto up/down markets"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "cryptography>=42",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kalshi-bot = "kalshi_bot.cli:main"

[tool.setuptools.packages.find]
include = ["kalshi_bot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
